name: Build and Publish to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # Permite executar e compilar binários ARM em runners x86 do GitHub
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # CRITICAL ADDITION: Set up Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Autenticação no Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and push using Buildx (bypasses local daemon cache issues)
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64
        push: true
        no-cache: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/img-api-bitcoin:latest
