name: Build and Publish to Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # --- CONFIGURAÇÃO PARA MULTI-ARQUITETURA (ARM) ---

    # Permite emular a arquitetura ARM no runner padrão do GitHub
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Cria o construtor Buildx do Docker e adiciona um ID para podermos referenciá-lo abaixo
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/api-bitcoin:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/api-bitcoin:${{ github.sha }}
